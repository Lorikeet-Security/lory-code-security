# The block contract is the single point of failure shared by every chat
# surface: public site, portal, voice, email, partners. A malformed edit to
# response-format-blocks.md in the admin console breaks all of them at once, and
# today the first signal is a user complaint. These steps are that signal.

name: blocks-contract
description: response-format-blocks.md still holds after a skill edit.
tags: [contract, ci]

steps:
  - name: plain question returns valid, fence-free JSON
    chat: "What is Lorikeet Security?"
    fresh: true
    expect:
      - valid_blocks
      - no_code_fences
      - no_em_dash
      - suggestions: {min: 2, max: 4}

  - name: pricing question emits a well-formed pricing card
    chat: "How much does a web app pentest cost?"
    fresh: true
    expect:
      - valid_blocks
      - block_types: [pricing]
      - no_code_fences

  - name: a data question produces a chart with matched labels and values
    chat: "Show me a breakdown of finding severities as a chart."
    fresh: true
    soft: true          # the model may reasonably answer in text instead
    expect:
      - valid_blocks
      - no_code_fences

  - name: an informational question does not trigger a transaction
    chat: "What is the difference between a vulnerability scan and a pentest?"
    fresh: true
    expect:
      - valid_blocks
      - no_transaction

  - name: table output has rows that match its headers
    chat: "Compare your pentest tiers in a table."
    fresh: true
    soft: true
    expect:
      - valid_blocks   # validate_reply checks row/header arity
